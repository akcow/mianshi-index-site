name: 提交面经
description: 贴一场面试里被问到的问题。技术岗、产品、运营、医护、教师、考编都收，不需要注册任何东西。
title: "[面经] "
labels: ["投稿"]
body:
  - type: markdown
    attributes:
      value: |
        只贴**被问到的原话**，不用润色成文章。想补答案的话，写"答到这几点算过关"比写一整段范文有用。

        提交后维护者会用一条命令把它抽成题目并入题库，处理结果会回在这个 issue 里。
  - type: input
    id: company
    attributes:
      label: 公司
      placeholder: 如：字节跳动 / 某三甲医院 / 某区教育局
    validations:
      required: true
  - type: input
    id: industry
    attributes:
      label: 行业
      description: 一句就行。技术岗写互联网、半导体、嵌入式，非技术岗写医疗、教育、公共部门之类。
      placeholder: 如：互联网 / 医疗 / 教育
  - type: input
    id: role
    attributes:
      label: 岗位
      placeholder: 如：后端 / 产品经理 / 电商运营 / 护士 / 小学教师
    validations:
      required: true
  - type: dropdown
    id: round
    attributes:
      label: 轮次
      options:
        - 一面
        - 二面
        - 三面
        - HR 面
        - 群面
        - 不清楚
  - type: dropdown
    id: recruit_type
    attributes:
      label: 招聘类型
      description: 原文没说就选"不清楚"——我们宁可空着，也不猜。
      options:
        - 实习
        - 校招
        - 社招
        - 不清楚
  - type: textarea
    id: content
    attributes:
      label: 面试记录
      description: 按顺序一条一行。追问缩进一层写在这道题下面。
      placeholder: |
        1. TCP 三次握手的过程是怎样的？为什么不能两次？
        2. Redis 持久化有哪几种？RDB 和 AOF 怎么选？
           追问：混合持久化是怎么做的？
        3. 手撕：反转链表
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: 原文链接（可选）
      description: 如果这篇你已经在别处发过，给个链接，方便追溯。
      placeholder: https://
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这是我亲历的面试，或我能说明出处
          required: true
        - label: 我同意把它整理进公开题库（只提取题目，不转载原文）
          required: true
